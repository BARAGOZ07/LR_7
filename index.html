
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея изображений</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">
        <h1>Галерея изображений</h1>

        <div class="gallery">

            <button class="arrow prev" id="prev"
                    aria-label="Предыдущая страница">
                &#10094;
            </button>

            <div class="viewport">
                <div class="slider" id="slider">

                    <div class="slide">
                        <img src="https://picsum.photos/seed/photo1/800/500"
                             alt="Изображение 1">
                    </div>

                    <div class="slide">
                        <img src="https://picsum.photos/seed/photo2/800/500"
                             alt="Изображение 2">
                    </div>

                    <div class="slide">
                        <img src="https://picsum.photos/seed/photo3/800/500"
                             alt="Изображение 3">
                    </div>

                    <div class="slide">
                        <img src="https://picsum.photos/seed/photo4/800/500"
                             alt="Изображение 4">
                    </div>

                    <div class="slide">
                        <img src="https://picsum.photos/seed/photo5/800/500"
                             alt="Изображение 5">
                    </div>

                    <div class="slide">
                        <img src="https://picsum.photos/seed/photo6/800/500"
                             alt="Изображение 6">
                    </div>

                    <div class="slide">
                        <img src="https://picsum.photos/seed/photo7/800/500"
                             alt="Изображение 7">
                    </div>

                    <div class="slide">
                        <img src="https://picsum.photos/seed/photo8/800/500"
                             alt="Изображение 8">
                    </div>

                </div>
            </div>

            <button class="arrow next" id="next"
                    aria-label="Следующая страница">
                &#10095;
            </button>

        </div>

        <div class="pager">
            <div id="pageNumbers"></div>
            <p id="pageInfo">Страница 1 из 3</p>
        </div>

    </main>

</body>
</html>
