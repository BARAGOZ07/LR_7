
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея изображений</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">
        <h1>Галерея изображений</h1>

        <div class="gallery">

            <button class="arrow prev" id="prev"
                    aria-label="Предыдущая страница">
                &#10094;
            </button>

            <div class="viewport">
                <div class="slider" id="slider">

                    <div class="slide">
                        <img src="lavanda_pole_zvezdnoe_nebo_123482_2560x1600.jpg"
                             alt="Изображение 1">
                    </div>

                    <div class="slide">
                        <img src="les_tuman_solnechnyj_svet_126926_2560x1600.jpg"
                             alt="Изображение 2">
                    </div>

                    <div class="slide">
                        <img src="more_zakat_gorizont_131804_2560x1600.jpg"
                             alt="Изображение 3">
                    </div>

                    <div class="slide">
                        <img src="okean_gorizont_zakat_135214_2560x1600.jpg"
                             alt="Изображение 4">
                    </div>

                    <div class="slide">
                        <img src="ozero_les_sneg_130421_2560x1600.jpg"
                             alt="Изображение 5">
                    </div>

                    <div class="slide">
                        <img src="zvezdnoe_nebo_noch_derevia_118760_2560x1600.jpg"
                             alt="Изображение 6">
                    </div>

                    <div class="slide">
                        <img src="podsolnuhi_pole_zakat_123231_2560x1600.jpg"
                             alt="Изображение 7">
                    </div>

                    <div class="slide">
                        <img src="poezd_zheleznaia_doroga_most_122067_2560x1600.jpg"
                             alt="Изображение 8">
                    </div>

                </div>
            </div>

            <button class="arrow next" id="next"
                    aria-label="Следующая страница">
                &#10095;
            </button>

        </div>

        <div class="pager">
            <div id="pageNumbers"></div>
            <p id="pageInfo">Страница 1 из 3</p>
        </div>

    </main>

</body>
</html>
